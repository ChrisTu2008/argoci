apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-local-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-local-app
  template:
    metadata:
      labels:
        app: my-local-app
    spec:
      containers:
        - name: my-local-app
          image: my-local-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: my-local-app
spec:
  selector:
    app: my-local-app
  ports:
    - port: 80
      targetPort: 80
  type: NodePort
